<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Media Downloader PRO</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #252525;
            --color-tiktok-red: #fe2c55;
            --color-tiktok-cyan: #25f4ee;
            --text-primary: hsla(0, 0%, 100%, 0.9);
            --text-secondary: hsla(0, 0%, 100%, 0.5);
            --radius-small: 6px;
            --radius-medium: 8px;
            --font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
        }

        body { 
            width: 480px; 
            font-family: var(--font-family); 
            padding: 16px; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            margin: 0; 
        }

        h3 { 
            font-size: 22px; 
            margin-top: 0;
            margin-bottom: 16px; 
            text-align: center; 
            font-weight: 700;
            background: linear-gradient(131.17deg, var(--color-tiktok-red), var(--color-tiktok-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notice { 
            font-size: 13px; 
            background: var(--bg-secondary); 
            border-left: 4px solid var(--color-tiktok-cyan); 
            padding: 12px; 
            border-radius: var(--radius-medium); 
            margin-bottom: 16px; 
            text-align: center; 
            line-height: 1.4; 
        }

        .modes-panel { 
            display: flex; 
            justify-content: center; 
            gap: 16px;
            background: var(--bg-secondary); 
            padding: 12px; 
            border-radius: var(--radius-medium); 
            margin-bottom: 16px; 
            font-size: 14px; 
            font-weight: 500;
        }

        .modes-panel label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .save-options { text-align: center; font-size: 13px; margin-bottom: 16px; color: var(--text-secondary); }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: var(--radius-medium);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            background: var(--bg-primary); 
            border: 1px solid #383838; 
            color: var(--text-primary); 
            border-radius: var(--radius-small); 
            font-size: 12px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-tiktok-cyan);
        }

        button { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            color: #fff; 
            font-weight: 600; 
            font-size: 13px;
            border-radius: var(--radius-small); 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; 
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.97); }

        /* Brand Colors */
        .btn-tk { background: #000; border: 1px solid #333; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-yt { background: #ff0000; }
        .btn-fb { background: #1877f2; }
        .btn-gen { background: #0be09b; color: #000; }
        .btn-rec { background: #ff4c3a; }

        #status { font-size: 13px; margin-top: 16px; text-align: center; color: var(--text-secondary); font-weight: 600; }
        #progress-container { width: 100%; background: #383838; border-radius: var(--radius-small); margin-top: 12px; display: none; height: 8px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--color-tiktok-cyan); transition: width 0.2s; }
    </style>
</head>
<body>
    <h3>Media Downloader PRO</h3>
    
    <div class="notice">
        Copie o link do seu vídeo e cole aqui na rede social referente.<br>Ou abra o vídeo e clique no botão. Caso a extensão não detecte, cole o link no espaço abaixo do botão correspondente.
    </div>

    <div class="modes-panel">
        <label><input type="radio" name="mode" value="video" checked> 🎬 Vídeo</label>
        <label><input type="radio" name="mode" value="audio"> 🎵 Áudio</label>
        <label><input type="radio" name="mode" value="image"> 🖼️ Imagem</label>
    </div>
    
    <div class="save-options">
        <label><input type="checkbox" id="ask-folder" checked> Perguntar onde salvar o arquivo</label>
    </div>

    <div class="grid-container">
        <div class="card">
            <button id="btn-tk" class="btn-tk" data-input="url-tk">Baixar TikTok</button>
            <input type="text" id="url-tk" placeholder="Cole o link do TikTok...">
        </div>

        <div class="card">
            <button id="btn-ig" class="btn-ig" data-input="url-ig">Baixar Instagram</button>
            <input type="text" id="url-ig" placeholder="Cole o link do Instagram...">
        </div>

        <div class="card">
            <button id="btn-yt" class="btn-yt" data-input="url-yt">Baixar YouTube</button>
            <input type="text" id="url-yt" placeholder="Cole o link do YouTube...">
        </div>

        <div class="card">
            <button id="btn-fb" class="btn-fb" data-input="url-fb">Baixar Facebook</button>
            <input type="text" id="url-fb" placeholder="Cole o link do Facebook...">
        </div>

        <div class="card">
            <button id="btn-gen" class="btn-gen" data-input="url-gen">🌐 Outras Redes</button>
            <input type="text" id="url-gen" placeholder="Cole qualquer link...">
        </div>

        <div class="card">
            <button id="btn-record" class="btn-rec" data-input="url-rec">🔴 Gravar Stream</button>
            <input type="text" id="url-rec" placeholder="Link de site protegido...">
        </div>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="status">Pronto para iniciar.</div>

    <script src="popup.js"></script>
</body>
</html>
