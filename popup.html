<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Universal Media Downloader</title>
    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
        }
        h3 {
            font-size: 16px;
            margin-top: 0;
            text-align: center;
            color: #4CAF50;
        }
        .options {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-around;
        }
        label {
            font-size: 13px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        #progress-container {
            width: 100%;
            background: #444;
            border-radius: 4px;
            margin-top: 15px;
            height: 8px;
            overflow: hidden;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.4s ease;
        }
        #status {
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            color: #aaa;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h3>Media Downloader</h3>
    <div class="options">
        <label><input type="radio" name="mode" value="video" checked> Vídeo (MP4)</label>
        <label><input type="radio" name="mode" value="audio"> Áudio (MP3)</label>
    </div>
    <button id="btn-download">Baixar Mídia</button>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="status">Pronto para iniciar...</div>

    <script src="popup.js"></script>
</body>
</html>
