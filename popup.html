<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Media Downloader PRO</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #252525;
            --color-tiktok-red: #fe2c55;
            --color-tiktok-cyan: #25f4ee;
            --text-primary: hsla(0, 0%, 100%, 0.9);
            --text-secondary: hsla(0, 0%, 100%, 0.5);
            --radius-small: 6px;
            --radius-medium: 8px;
            --font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
        }

        ::-webkit-scrollbar { display: none; }
        body { 
            width: 480px; font-family: var(--font-family); padding: 16px; 
            background: var(--bg-primary); color: var(--text-primary); 
            margin: 0; overflow-x: hidden; scrollbar-width: none; 
        }

        h3 { 
            font-size: 22px; margin-top: 0; margin-bottom: 16px; 
            text-align: center; font-weight: 700;
            background: linear-gradient(131.17deg, var(--color-tiktok-red), var(--color-tiktok-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .modes-panel { 
            display: flex; justify-content: center; gap: 16px;
            background: var(--bg-secondary); padding: 12px; 
            border-radius: var(--radius-medium); margin-bottom: 16px; 
            font-size: 14px; font-weight: 500;
        }

        .modes-panel label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .save-options { text-align: center; font-size: 13px; margin-bottom: 16px; color: var(--text-secondary); }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .card {
            background: var(--bg-secondary); padding: 12px;
            border-radius: var(--radius-medium); display: flex;
            flex-direction: column; gap: 8px; border: 1px solid transparent;
        }

        .card-full { grid-column: span 2; }

        input[type="text"] { 
            width: 100%; padding: 10px; box-sizing: border-box; 
            background: var(--bg-primary); border: 1px solid #383838; 
            color: var(--text-primary); border-radius: var(--radius-small); 
            font-size: 12px;
        }
        input[type="text"]:focus { outline: none; border-color: var(--color-tiktok-cyan); }

        button { 
            width: 100%; padding: 10px; border: none; color: #fff; 
            font-weight: 600; font-size: 13px; border-radius: var(--radius-small); 
            cursor: pointer; transition: opacity 0.2s; 
        }
        button:hover { opacity: 0.9; }

        .btn-tk { background: #000; border: 1px solid #333; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-fb { background: #1877f2; }
        .btn-gen { background: #0be09b; color: #000; }
        .btn-rec { background: #ff4c3a; }
        .btn-spy { background: linear-gradient(90deg, #1877f2 0%, #d946ef 100%); font-size: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3); }

        #status-panel { 
            background: var(--bg-secondary); border-radius: var(--radius-medium);
            padding: 14px; margin-top: 16px; display: none; 
        }
        #status { font-size: 15px; text-align: center; color: var(--text-primary); font-weight: 500; line-height: 1.5; }
        #progress-container { width: 100%; background: #383838; border-radius: var(--radius-small); margin-top: 12px; display: none; height: 8px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--color-tiktok-cyan); transition: width 0.2s; }
    </style>
</head>
<body>
    <h3>Media Downloader PRO</h3>
    
    <div class="modes-panel">
        <label><input type="radio" name="mode" value="video" checked> 🎬 Vídeo</label>
        <label><input type="radio" name="mode" value="audio"> 🎵 Áudio</label>
        <label><input type="radio" name="mode" value="image"> 🖼️ Imagem</label>
    </div>
    
    <div class="save-options">
        <label><input type="checkbox" id="ask-folder" checked> Perguntar onde salvar o arquivo</label>
    </div>

    <div class="grid-container">
        <div class="card">
            <button id="btn-tk" class="btn-tk" data-input="url-tk">Baixar TikTok</button>
            <input type="text" id="url-tk" placeholder="Se o clique falhar, cole o link aqui">
        </div>
        <div class="card">
            <button id="btn-ig" class="btn-ig" data-input="url-ig">Baixar Instagram</button>
            <input type="text" id="url-ig" placeholder="Se o clique falhar, cole o link aqui">
        </div>
        <div class="card">
            <button id="btn-fb" class="btn-fb" data-input="url-fb">Baixar Facebook</button>
            <input type="text" id="url-fb" placeholder="Se o clique falhar, cole o link aqui">
        </div>
        <div class="card">
            <button id="btn-gen" class="btn-gen" data-input="url-gen">🌐 Outras Redes / Anúncios</button>
            <input type="text" id="url-gen" placeholder="Cole o link do site genérico...">
        </div>
        <div class="card card-full">
            <button id="btn-record" class="btn-rec" data-input="url-rec">🔴 Gravar Stream (Sites Protegidos)</button>
            <input type="text" id="url-rec" placeholder="Cole o link para gravação...">
        </div>
        
        <!-- BUSCA DE OFERTAS NO FACEBOOK -->
        <div class="card card-full" style="background: #1c1c1c; border: 1px solid #383838;">
            <button id="btn-spy" class="btn-spy">🔎 Procurar ofertas no Facebook</button>
            <input type="text" id="niche-input" placeholder="Qual o nicho ou categoria de produto você procura. Preencha." style="margin-top: 10px; border-color: #555;">
        </div>
    </div>

    <div id="status-panel">
        <div id="status"></div>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
