<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Universal Media Downloader</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #181818;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #fff;
    }

    button {
      width: 100%;
      background-color: #cc0000;
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #e60000;
    }

    #status {
      margin-top: 14px;
      font-size: 12px;
      color: #aaa;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <h2>Baixar Player Atual</h2>

  <button id="btn-download">
    📥 Baixar Vídeo Rodando
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
