<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Media Downloader</title>
    <style>
        body { width: 320px; font-family: Arial, sans-serif; padding: 12px; background: #121212; color: #fff; margin: 0; }
        h3 { font-size: 15px; margin-bottom: 8px; color: #10b981; text-align: center; }
        .notice { font-size: 11px; color: #fbbf24; background: #1e1e1e; border: 1px dashed #fbbf24; padding: 6px; border-radius: 4px; margin-bottom: 10px; text-align: center; line-height: 1.3; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 4px; margin-bottom: 10px; }
        .modes { display: flex; justify-content: space-around; margin-bottom: 12px; font-size: 13px; background: #1e1e1e; padding: 8px; border-radius: 4px; border: 1px solid #333;}
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        button { width: 100%; padding: 8px; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 12px;}
        button:hover { opacity: 0.8; }
        
        /* Cores das Redes Sociais */
        .btn-yt { background: #ef4444; } /* Vermelho */
        .btn-ig { background: #d946ef; } /* Rosa/Roxo */
        .btn-fb { background: #3b5998; } /* Azul FB */
        .btn-tk { background: #000000; border: 1px solid #333; } /* Preto TikTok */
        .btn-gen { background: #10b981; grid-column: span 2; } /* Verde - Genérico */
        .btn-rec { background: #f97316; grid-column: span 2; margin-top: 4px; } /* Laranja - Gravação Local */

        #status { font-size: 12px; margin-top: 10px; text-align: center; color: #a1a1aa; font-weight: bold; }
        #progress-container { width: 100%; background: #222; border-radius: 4px; margin-top: 8px; display: none; height: 6px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }
    </style>
</head>
<body>
    <h3>Media Downloader & Sniffer</h3>
    
    <div class="notice">
        ⚠️ <strong>Aviso:</strong> Abra o post, Reels, TikTok ou copie o link direto antes de clicar!
    </div>

    <input type="text" id="media-url" placeholder="URL da mídia...">
    
    <div class="modes">
        <label><input type="radio" name="mode" value="video" checked> 🎬 Vídeo</label>
        <label><input type="radio" name="mode" value="audio"> 🎵 Áudio</label>
        <label><input type="radio" name="mode" value="image"> 🖼️ Imagem</label>
    </div>
    
    <div style="margin-bottom: 8px; text-align: center; font-size: 12px;">
        <label><input type="checkbox" id="ask-folder" checked> Perguntar onde salvar</label>
    </div>

    <div class="grid-buttons">
        <button id="btn-yt" class="btn-yt">Baixar YouTube</button>
        <button id="btn-ig" class="btn-ig">Baixar Instagram</button>
        <button id="btn-fb" class="btn-fb">Baixar Facebook</button>
        <button id="btn-tk" class="btn-tk">Baixar TikTok</button>
        <button id="btn-gen" class="btn-gen">🌐 Baixar de Outra Rede</button>
        <button id="btn-record" class="btn-rec">🔴 Gravar Stream (Protegidos)</button>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="status">Pronto para iniciar.</div>

    <script src="popup.js"></script>
</body>
</html>
