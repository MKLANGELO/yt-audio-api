<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Media Downloader</title>
    <style>
        body { width: 300px; font-family: Arial, sans-serif; padding: 10px; background: #121212; color: #fff; margin: 0; }
        h3 { font-size: 14px; margin-bottom: 6px; color: #10b981; text-align: center; }
        .notice { font-size: 10px; color: #fbbf24; background: #1e1e1e; border: 1px dashed #fbbf24; padding: 5px; border-radius: 4px; margin-bottom: 8px; text-align: center; line-height: 1.2; }
        input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 4px; margin-bottom: 8px; }
        .modes { display: flex; justify-content: space-around; margin-bottom: 8px; font-size: 12px; }
        button { width: 100%; padding: 8px; background: #10b981; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 4px; }
        button.record { background: #ef4444; }
        button:hover { opacity: 0.9; }
        #status { font-size: 11px; margin-top: 8px; text-align: center; color: #a1a1aa; }
        #progress-container { width: 100%; background: #222; border-radius: 4px; margin-top: 8px; display: none; height: 6px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }
    </style>
</head>
<body>
    <h3>Media Downloader & Sniffer</h3>
    
    <div class="notice">
        ⚠️ <strong>Aviso:</strong> Abra o vídeo, Reels, TikTok, Instagram, etc., ou copie o link direto do vídeo antes de clicar!
    </div>

    <input type="text" id="media-url" placeholder="URL da mídia...">
    
    <div class="modes">
        <label><input type="radio" name="mode" value="video" checked> Vídeo</label>
        <label><input type="radio" name="mode" value="audio"> Áudio</label>
        <label><input type="checkbox" id="ask-folder" checked> Salvar como...</label>
    </div>

    <button id="btn-download">Iniciar Download (Servidor)</button>
    <button id="btn-record" class="record">🔴 Gravar Stream da Tela (Local)</button>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="status">Pronto para iniciar.</div>

    <script src="popup.js"></script>
</body>
</html>
